<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP001 — Ali and the Sneaky Fox</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/ali-fox.js"></script>
    <style>
      @font-face { font-family: "Lilita One"; src: url("assets/fonts/lilita-one-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Baloo 2"; font-weight: 800; src: url("assets/fonts/baloo-2-latin-800-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #2a2458; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #ffe3a6; }
      .clip { position: absolute; inset: 0; }
      #cam { position: absolute; left: 0; top: 0; width: 2400px; height: 1920px; transform-origin: 0 0; }
      #vignette { background: radial-gradient(ellipse 80% 62% at 50% 45%, rgba(0,0,0,0) 58%, rgba(40,20,10,.38) 100%); pointer-events: none; }
      #sunset { background: linear-gradient(180deg, rgba(255,110,70,.0) 0%, rgba(255,120,80,.55) 100%); opacity: 0; mix-blend-mode: multiply; pointer-events: none; }
      .cap {
        position: absolute; left: 0; right: 0; top: 1225px; text-align: center;
        font-family: "Lilita One", "Baloo 2", sans-serif; font-size: 104px; line-height: 1;
        color: #fff; letter-spacing: 1px; text-transform: uppercase;
        -webkit-text-stroke: 14px #1a0f2e; paint-order: stroke fill;
        text-shadow: 0 8px 0 rgba(26,15,46,.55);
      }
      #end { opacity: 0; }
      #end .band { position: absolute; left: 0; right: 0; top: 620px; height: 560px; background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(30,14,50,.6), rgba(30,14,50,0) 70%); }
      #end .t1 { position: absolute; left: 0; right: 0; top: 720px; text-align: center; font-family: "Lilita One", sans-serif; font-size: 160px; line-height: 1; color: #ffd66b; -webkit-text-stroke: 18px #2a1450; paint-order: stroke fill; text-shadow: 0 12px 0 rgba(42,20,80,.6); }
      #end .t2 { position: absolute; left: 0; right: 0; top: 930px; text-align: center; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 56px; color: #fff; -webkit-text-stroke: 10px #2a1450; paint-order: stroke fill; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="39.6" data-width="1080" data-height="1920">
      <div id="worldclip" class="clip" data-start="0" data-duration="39.6" data-track-index="0">
        <div id="cam">
          <svg id="world" width="2400" height="1920" viewBox="0 0 2400 1920">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8fd3f4"/><stop offset=".5" stop-color="#d9f1e0"/><stop offset="1" stop-color="#ffe9b0"/>
              </linearGradient>
              <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8fd66b"/><stop offset="1" stop-color="#3b8f50"/>
              </linearGradient>
              <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e3b374"/><stop offset="1" stop-color="#b98245"/>
              </linearGradient>
              <radialGradient id="sun"><stop offset="0" stop-color="#fffbe0" stop-opacity="1"/><stop offset=".25" stop-color="#fff0a8" stop-opacity=".7"/><stop offset="1" stop-color="#fff0a8" stop-opacity="0"/></radialGradient>
              <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9dba0"/><stop offset="1" stop-color="#7fc28b"/></linearGradient>
              <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc27b"/><stop offset="1" stop-color="#4ea46a"/></linearGradient>
            </defs>
            <rect width="2400" height="1200" fill="url(#sky)"/>
            <circle cx="1750" cy="520" r="420" fill="url(#sun)"/>
            <g id="clouds"></g>
            <path d="M0 1010 C300 900 520 940 800 1000 C1100 920 1400 900 1700 990 C1950 930 2200 950 2400 1000 L2400 1200 L0 1200Z" fill="url(#hillA)"/>
            <path d="M0 1080 C260 1020 520 1030 760 1070 C1060 1010 1380 1020 1700 1075 C1960 1030 2200 1040 2400 1080 L2400 1220 L0 1220Z" fill="url(#hillB)"/>
            <g id="trees"></g>
            <rect y="1120" width="2400" height="800" fill="url(#grass)"/>
            <path d="M-50 1135 C500 1110 1300 1160 2450 1125 L2450 1500 C1300 1560 500 1470 -50 1520Z" fill="url(#path)"/>
            <path d="M-50 1135 C500 1110 1300 1160 2450 1125" stroke="#9a6a38" stroke-width="6" fill="none" opacity=".5"/>
            <g id="flowers"></g>

            <g id="bushBack" style="opacity:0"></g>
            <g id="foxPos" style="opacity:0"><g id="foxRot"><g id="foxG"></g></g></g>
            <g id="aliPos"><g id="aliFlip"><g id="aliG"></g></g></g>
            <g id="flyBread" opacity="0"></g>
            <g id="bush"></g>
            <g id="fgGrass"></g>
          </svg>
        </div>
      </div>

      <div id="sunset" class="clip" data-start="0" data-duration="39.6" data-track-index="2"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="39.6" data-track-index="3"></div>

      <div id="end" class="clip" data-start="36.6" data-duration="3.0" data-track-index="4">
        <div class="band"></div>
        <div class="t1">PART 2?</div>
        <div class="t2">Was the fox really sneaky?</div>
      </div>

      <div id="caps" class="clip" data-start="0" data-duration="39.6" data-track-index="5"></div>

      <!-- AUDIO -->
      <audio id="a-music" src="assets/music/lullaby-long.wav" data-start="0" data-duration="39.6" data-volume="0.14" data-fade-in="0.4" data-fade-out="1.5" data-track-index="10"></audio>
      <audio id="a-l1" src="assets/vo/l1.wav" data-start="0.4" data-duration="3.65" data-volume="1" data-track-index="12"></audio>
      <audio id="a-l2" src="assets/vo/l2.wav" data-start="4.5" data-duration="3.5" data-volume="1" data-track-index="12"></audio>
      <audio id="a-l3" src="assets/vo/l3.wav" data-start="8.45" data-duration="3.35" data-volume="1" data-track-index="12"></audio>
      <audio id="a-l4" src="assets/vo/l4.wav" data-start="12.3" data-duration="6.95" data-volume="1" data-track-index="12"></audio>
      <audio id="a-l5" src="assets/vo/l5.wav" data-start="19.8" data-duration="4.76" data-volume="1" data-track-index="12"></audio>
      <audio id="a-l6" src="assets/vo/l6.wav" data-start="25.05" data-duration="4.1" data-volume="1" data-track-index="12"></audio>
      <audio id="a-l7" src="assets/vo/l7.wav" data-start="29.6" data-duration="3.73" data-volume="1" data-track-index="12"></audio>
      <audio id="a-l8" src="assets/vo/l8.wav" data-start="33.8" data-duration="2.43" data-volume="1" data-track-index="12"></audio>
      <audio id="a-swish" src="assets/sfx/swish.wav" data-start="3.05" data-duration="0.7" data-volume="0.7" data-track-index="14"></audio>
      <audio id="a-snatch" src="assets/sfx/snatch.wav" data-start="25.6" data-duration="0.35" data-volume="0.8" data-track-index="15"></audio>
      <audio id="a-zoom" src="assets/sfx/whoosh.wav" data-start="27.0" data-duration="1.1" data-volume="0.5" data-track-index="16"></audio>
      <audio id="a-grumble" src="assets/sfx/grumble.wav" data-start="32.2" data-duration="1.6" data-volume="0.6" data-track-index="17"></audio>
      <audio id="a-steps" src="assets/sfx/steps.wav" data-start="34.9" data-duration="1.7" data-volume="0.5" data-track-index="18"></audio>
      <audio id="a-chime" src="assets/sfx/chime.wav" data-start="36.7" data-duration="2.5" data-volume="0.4" data-track-index="19"></audio>
    </div>

    <script>
      const WORDS = /*WORDS*/[];
      const $ = (s) => document.querySelector(s);
      const clean = (w) => w.toLowerCase().replace(/[^a-z']/g, "");
      const wt = (w, n = 0) => { const k = WORDS.filter((x) => clean(x.w) === clean(w)); return k[n].s; };

      function mulberry(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = mulberry(5);

      // ---------- world ----------
      let clouds = "";
      for (let i = 0; i < 7; i++) {
        const x = 150 + i * 340 + R() * 80, y = 160 + R() * 360, s = 0.8 + R() * 0.8;
        clouds += `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) scale(${s.toFixed(2)})" opacity=".92"><ellipse cx="0" cy="0" rx="120" ry="42" fill="#fff"/><ellipse cx="-60" cy="-22" rx="60" ry="42" fill="#fff"/><ellipse cx="40" cy="-34" rx="70" ry="50" fill="#fff"/></g>`;
      }
      $("#clouds").innerHTML = clouds;

      function tree(x, y, s, shade) {
        const g1 = shade ? "#3f9a58" : "#58b866", g2 = shade ? "#2f8049" : "#46a257";
        return `<g transform="translate(${x} ${y}) scale(${s})">
          <rect x="-22" y="-210" width="44" height="210" rx="14" fill="#8a5a33" stroke="#4a2c14" stroke-width="5"/>
          <circle cx="-70" cy="-250" r="95" fill="${g2}" stroke="#2a6a3c" stroke-width="5"/>
          <circle cx="70" cy="-262" r="100" fill="${g2}" stroke="#2a6a3c" stroke-width="5"/>
          <circle cx="0" cy="-320" r="112" fill="${g1}" stroke="#2a6a3c" stroke-width="5"/>
          <circle cx="-30" cy="-345" r="42" fill="#7fd47c" opacity=".55"/>
        </g>`;
      }
      let trees = "";
      for (let i = 0; i < 13; i++) trees += tree(60 + i * 190 + R() * 60, 1085 + R() * 30, 0.55 + R() * 0.15, 0);
      for (let i = 0; i < 7; i++) trees += tree(40 + i * 370 + R() * 120, 1135 + R() * 20, 0.95 + R() * 0.25, 1);
      $("#trees").innerHTML = trees;

      let fl = "";
      for (let i = 0; i < 46; i++) {
        const x = R() * 2400, y = 1540 + R() * 360, c = ["#ff8fb8", "#fff", "#ffd24d", "#c79bff"][i % 4];
        fl += `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><path d="M0 0 L0 26" stroke="#2f7d3a" stroke-width="4"/><circle cx="0" cy="-2" r="9" fill="${c}"/><circle cx="0" cy="-2" r="3.5" fill="#ffb02e"/></g>`;
      }
      $("#flowers").innerHTML = fl;
      let gr = "";
      for (let i = 0; i < 60; i++) { const x = R() * 2400, h = 50 + R() * 60; gr += `<path d="M${x.toFixed(0)} 1920 Q${(x + 12).toFixed(0)} ${1920 - h * 0.6} ${(x + 4).toFixed(0)} ${1920 - h}" stroke="#2f7d3a" stroke-width="8" fill="none" stroke-linecap="round"/>`; }
      $("#fgGrass").innerHTML = gr;

      // bush that hides the fox at first (x≈900)
      const BUSH = `<g transform="translate(930 1215)">
        <ellipse cx="0" cy="8" rx="190" ry="22" fill="rgba(30,60,30,.3)"/>
        <circle cx="-100" cy="-60" r="82" fill="#2f8049" stroke="#1f5a34" stroke-width="6"/>
        <circle cx="0" cy="-90" r="105" fill="#3f9a58" stroke="#1f5a34" stroke-width="6"/>
        <circle cx="105" cy="-55" r="85" fill="#2f8049" stroke="#1f5a34" stroke-width="6"/>
        <circle cx="-20" cy="-120" r="36" fill="#7fd47c" opacity=".5"/>
        <circle cx="60" cy="-70" r="9" fill="#ff6a6a"/><circle cx="-60" cy="-40" r="9" fill="#ff6a6a"/><circle cx="20" cy="-30" r="9" fill="#ff6a6a"/>
      </g>`;
      $("#bush").innerHTML = BUSH; $("#bushBack").innerHTML = BUSH;

      // ---------- characters ----------
      $("#aliG").innerHTML = SK2.ali();
      $("#foxG").innerHTML = SK2.fox();
      $(".ali-armL").insertAdjacentHTML("beforebegin", `<g class="ali-bread" transform="translate(0 -282)">${SK2.bread(1)}</g>`);
      $("#flyBread").innerHTML = SK2.bread(0.75);
      $("#end") && 0;

      // captions — one word at a time
      WORDS.forEach((w, i) => {
        const nxt = WORDS[i + 1];
        let e = w.e; if (nxt && nxt.s < e + 0.4) e = nxt.s; if (e - w.s < 0.14) e = w.s + 0.14;
        $("#caps").insertAdjacentHTML("beforeend", `<div class="cap clip" id="w${i}" data-start="${w.s}" data-duration="${(e - w.s).toFixed(2)}" data-track-index="${20 + (i % 2)}">${w.w.replace(/[“”"]/g, "")}</div>`);
      });

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      const AS = 0.75, FS = 0.9;               // character scales
      const GY = 1190;                           // ground y of the feet
      const cam = (t, wx, wy, sx, sy, s, d = 0.7) => tl.to("#cam", { x: sx - s * wx, y: sy - s * wy, scale: s, duration: d, ease: "power2.inOut" }, t);
      const show = (sel, v, t) => tl.set(sel, { opacity: v }, t);

      // initial state
      tl.set("#cam", { x: -100, y: 0, scale: 1 }, 0);
      tl.set("#aliPos", { x: 270, y: GY }, 0);
      tl.set("#aliFlip", { scaleX: 1 }, 0);
      tl.set("#aliG", { scale: AS, transformOrigin: "0px 0px" }, 0);
      tl.set("#foxPos", { x: 880, y: GY + 330 }, 0);     // hidden below the bush
      tl.set("#foxG", { scale: FS, transformOrigin: "0px 0px" }, 0);
      tl.set("#foxRot", { scaleY: 1 }, 0);

      // idle: breathing + blinks
      tl.to(".ali-body", { scaleY: 1.014, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 35 }, 0);
      tl.to(".fox-body", { scaleY: 1.016, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 38 }, 0);
      [1.9, 6.1, 10.4, 15.2, 21.0, 27.9, 31.2, 35.0].forEach((t) => {
        tl.to(".ali-lid", { scaleY: 1, duration: 0.07, yoyo: true, repeat: 1 }, t);
        tl.to(".fox-lid", { scaleY: 1, duration: 0.07, yoyo: true, repeat: 1 }, t + 0.3);
      });
      // fox tail wag
      tl.to(".fox-tail", { rotation: 8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 70 }, 0);

      // helpers: mouth talk
      const talk = (open, closed, t0, t1, step = 0.2) => {
        for (let t = t0; t < t1; t += step) { tl.set(open, { opacity: 1 }, t); tl.set(closed, { opacity: 0 }, t); tl.set(open, { opacity: 0 }, t + step * 0.5); tl.set(closed, { opacity: 1 }, t + step * 0.5); }
        tl.set(open, { opacity: 0 }, t1); tl.set(closed, { opacity: 1 }, t1);
      };
      const walk = (t0, t1, who = "ali") => {
        const n = Math.round((t1 - t0) / 0.3);
        if (who === "ali") {
          tl.to(".ali-legL", { rotation: 11, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
          tl.to(".ali-legR", { rotation: -11, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
          tl.to("#aliG", { y: -5, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: n * 2 }, t0);
          tl.to(".ali-legL,.ali-legR", { rotation: 0, duration: 0.2 }, t1 + 0.35);
        } else {
          tl.to(".fox-leg", { rotation: 22, duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: Math.round((t1 - t0) / 0.14) }, t0);
          tl.to(".fox-leg", { rotation: 0, duration: 0.2 }, t1 + 0.15);
        }
      };

      // ===== S1 (0.4–4.5): Ali walks, fox appears =====
      tl.to("#aliPos", { x: 470, duration: 4.0, ease: "none" }, 0.3);
      walk(0.3, 4.3);
      cam(0.4, 540, 900, 540, 900, 1, 0.01);
      tl.to("#cam", { x: -250, duration: 4.4, ease: "sine.inOut" }, 0.2);
      const cameT = wt("came");
      tl.set("#foxPos", { opacity: 1 }, cameT - 0.3);
      tl.to("#foxPos", { y: GY, duration: 0.6, ease: "back.out(1.6)" }, cameT - 0.3);
      tl.set("#bushBack", { opacity: 1 }, cameT + 0.9); tl.set("#bush", { opacity: 0 }, cameT + 0.9);
      tl.to("#bush", { rotation: -2, svgOrigin: "930 1215", duration: 0.12, yoyo: true, repeat: 3 }, cameT - 0.35);

      // ===== S2 (4.5–8.3): fox asks for bread =====
      tl.to("#foxPos", { x: 800, duration: 1.6, ease: "sine.inOut" }, 4.3);
      walk(4.3, 5.7, "fox");
      talk(".fox-m-open", ".fox-m-smirk", 4.55, 8.0);
      tl.to(".fox-head", { rotation: -5, duration: 0.4, yoyo: true, repeat: 5, ease: "sine.inOut" }, 4.6);
      tl.to(".ali-armR", { rotation: 14, duration: 0.5, yoyo: true, repeat: 1 }, 6.3);

      // ===== S3 (8.3–12.1): Ali says no, close-up =====
      cam(8.2, 480, GY - AS * 450, 540, 780, 1.55, 0.7);
      talk(".ali-m-open", ".ali-m-flat", 8.5, 11.7, 0.22);
      tl.set(".ali-m-smile", { opacity: 0 }, 8.3);
      tl.set(".ali-m-flat", { opacity: 1 }, 8.3);
      tl.to(".ali-head", { rotation: 9, duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, wt("no,") - 0.1);
      tl.to(".ali-bread", { y: -8, duration: 0.3, yoyo: true, repeat: 3 }, 9.3);
      tl.to(".ali-brow-l", { y: 5, duration: 0.3 }, 8.5); tl.to(".ali-brow-r", { y: 5, duration: 0.3 }, 8.5);

      // ===== S4 (12.1–19.5): fox falls down & pretends to be sick =====
      cam(12.0, 650, 1000, 540, 1000, 1.1, 0.8);
      tl.set(".ali-m-flat", { opacity: 0 }, 12.0); tl.set(".ali-m-smile", { opacity: 1 }, 12.0);
      const lay = wt("lay");
      tl.to("#foxRot", { scaleY: 0.5, svgOrigin: "0 0", duration: 0.45, ease: "bounce.out" }, lay);
      tl.to(".fox-head", { rotation: 16, duration: 0.5 }, lay + 0.2);
      tl.to("#foxPos", { x: 830, duration: 0.55 }, lay);
      tl.set(".fox-paw", { opacity: 1 }, lay + 0.6);
      tl.set(".fox-brow", { opacity: 1 }, lay);
      tl.to(".fox-brow", { rotation: 14, svgOrigin: "-132 -280", duration: 0.3 }, lay + 0.3);
      const cried = wt("cried,");
      talk(".fox-m-open", ".fox-m-smirk", cried + 0.35, 19.0, 0.26);
      for (let t = cried + 0.2; t < 19.2; t += 0.5) tl.fromTo(".fox-tear", { opacity: 0, y: 0 }, { opacity: 1, y: 26, duration: 0.4, immediateRender: false }, t);
      tl.to("#foxG", { x: 4, duration: 0.07, yoyo: true, repeat: 40 }, cried + 0.3);
      tl.to(".ali-head", { rotation: -6, duration: 0.5 }, 16.5);
      // Ali gets sad
      tl.set(".ali-m-smile", { opacity: 0 }, 17.6); tl.set(".ali-m-sad", { opacity: 1 }, 17.6);

      // ===== S5 (19.5–24.9): Ali gives the bread =====
      cam(19.4, 650, 940, 540, 900, 1.25, 0.8);
      tl.to(".ali-head", { rotation: 0, duration: 0.3 }, 19.5);
      tl.to(".ali-brow-l", { rotation: -12, svgOrigin: "-42 -486", duration: 0.4 }, 19.9);
      tl.to(".ali-brow-r", { rotation: 12, svgOrigin: "42 -486", duration: 0.4 }, 19.9);
      const give = wt("give", 1);
      tl.set(".ali-bread", { opacity: 0 }, give);
      tl.set("#flyBread", { opacity: 1, x: 480, y: GY - AS * 280 }, give);
      tl.to("#flyBread", { x: 740, rotation: 360, duration: 0.9, ease: "power1.inOut" }, give);
      tl.to("#flyBread", { y: GY - 340, duration: 0.4, ease: "power2.out" }, give);
      tl.to("#flyBread", { y: GY - 70, duration: 0.5, ease: "power2.in" }, give + 0.4);

      // ===== S6 (24.9–29.4): the fox grabs it and runs =====
      const grab = wt("grabbed"), jump = wt("jumped"), ran = wt("ran");
      cam(24.9, 700, 1000, 540, 1000, 1.1, 0.5);
      tl.to("#foxRot", { scaleY: 1, svgOrigin: "0 0", duration: 0.25, ease: "back.out(2)" }, grab - 0.15);
      tl.to(".fox-head", { rotation: 0, duration: 0.2 }, grab - 0.15);
      tl.to("#foxPos", { y: GY, x: 790, duration: 0.25 }, grab - 0.15);
      tl.set(".fox-paw", { opacity: 0 }, grab - 0.15);
      tl.set(".fox-tear", { opacity: 0 }, grab - 0.15);
      tl.set("#flyBread", { opacity: 0 }, grab + 0.05);
      tl.set(".fox-bread", { opacity: 1 }, grab + 0.05);
      tl.to(".fox-brow", { rotation: 0, svgOrigin: "-132 -280", duration: 0.2 }, grab);
      tl.to("#foxPos", { y: GY - 90, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, jump - 0.1);
      tl.to(".fox-head", { rotation: -10, duration: 0.2 }, jump);
      tl.to("#foxPos", { x: 2300, duration: 2.2, ease: "power1.in" }, jump + 0.3);
      walk(ran - 0.1, ran + 2.0, "fox");
      cam(ran - 0.1, 1400, 1000, 540, 1000, 1.0, 1.4);
      cam(ran + 1.5, 480, 1000, 540, 1000, 1.05, 1.0);
      // Ali shocked
      tl.set(".ali-m-sad", { opacity: 0 }, wt("not"));
      tl.set(".ali-m-open", { opacity: 1 }, wt("not"));
      tl.to("#aliG", { y: -14, duration: 0.15, yoyo: true, repeat: 1 }, wt("not"));

      // ===== S7 (29.4–33.6): Ali with teary eyes & grumbling tummy =====
      cam(29.3, 480, GY - AS * 445, 540, 790, 1.85, 0.8);
      tl.set(".ali-m-open", { opacity: 0 }, 29.5); tl.set(".ali-m-sad", { opacity: 1 }, 29.5);
      for (let t = 30.1; t < 33.4; t += 0.7) {
        tl.fromTo(".ali-tear-l", { opacity: 0, y: 0 }, { opacity: 1, y: 38, duration: 0.6, ease: "power1.in", immediateRender: false }, t);
        tl.fromTo(".ali-tear-r", { opacity: 0, y: 0 }, { opacity: 1, y: 38, duration: 0.6, ease: "power1.in", immediateRender: false }, t + 0.25);
      }
      tl.to(".ali-body", { x: 3, duration: 0.06, yoyo: true, repeat: 17 }, wt("grumbling") - 0.15);

      // ===== S8 (33.6–36.6): Ali turns and walks home =====
      cam(33.5, 420, 1000, 540, 960, 1.0, 1.0);
      tl.set(".ali-tear", { opacity: 0 }, 33.8);
      tl.set("#aliFlip", { scaleX: -1 }, wt("turned"));
      tl.to("#aliPos", { x: 60, duration: 2.8, ease: "sine.inOut" }, wt("walked") - 0.3);
      walk(wt("walked") - 0.3, 36.2);
      tl.to("#cam", { x: 0, duration: 2.8, ease: "sine.inOut" }, 34.0);
      tl.to("#sunset", { opacity: 1, duration: 2.8 }, 33.8);

      // ===== end card =====
      tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 36.7);
      tl.fromTo("#end .t1", { scale: 0.4, rotation: -6 }, { scale: 1, rotation: -3, duration: 0.5, ease: "back.out(2.2)" }, 36.7);
      tl.fromTo("#end .t2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 37.1);
      tl.to("#end .t1", { scale: 1.05, duration: 0.7, yoyo: true, repeat: 2, ease: "sine.inOut" }, 37.3);

      // captions pop
      WORDS.forEach((w, i) => tl.fromTo(`#w${i}`, { scale: 0.55, y: 14 }, { scale: 1, y: 0, duration: 0.13, ease: "back.out(3)" }, w.s));

      tl.set({}, {}, 39.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
