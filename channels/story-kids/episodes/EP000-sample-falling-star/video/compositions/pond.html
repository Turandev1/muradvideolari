  <script>
    (function () {

      const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const NS = "http://www.w3.org/2000/svg";

      }
      // Fireflies
      const fl = $("#pond-flies"), flies = [];
      for (let i = 0; i < 11; i++) {
        const g = mk("g", {}, fl);

      const tl = gsap.timeline({ paused: true });

      gsap.set("#pond-nori-o", { scale: 0, svgOrigin: "150 176" });
      gsap.set("#pond-nori-smile", { opacity: 1 });
      gsap.set(["#pond-splash1", "#pond-splash2"], { scale: 0, opacity: 1, transformOrigin: "50% 100%" });
      gsap.set(["#pond-rip1a", "#pond-rip1b", "#pond-rip2a", "#pond-rip2b"], { scale: 0.2, opacity: 0, transformOrigin: "50% 50%" });

      gsap.set("#pond-fish2", { x: 1180, y: 2880, scaleX: -1 });

      // ---------- ambient life (all finite) ----------

      tl.to("#pond-world", { y: -2300, duration: 2.2, ease: "power2.inOut" }, 7.5);
      tl.to("#pond-skyfar", { y: 1050, duration: 2.2, ease: "power2.inOut" }, 7.5);
      // 9.8–15 s: final push-in on Lumi and Nori.
      tl.set("#pond-cam", { transformOrigin: "540px 860px" }, 9.75);
      tl.to("#pond-cam", { scale: 1.26, duration: 5.2, ease: "sine.inOut" }, 9.8);

      // ---------- the falling star ----------
      tl.to(["#pond-star", "#pond-trail"], { x: 720 - 130, duration: 2.9, ease: "sine.out" }, 0);
      tl.to(["#pond-star", "#pond-trail"], { y: 1885 - 130, duration: 2.9, ease: "power1.in" }, 0);

      tl.fromTo("#pond-rip1b", { scale: 0.2, opacity: 1 }, { scale: 2.0, opacity: 0, duration: 1.4, ease: "power2.out", immediateRender: false }, 3.3);

      tl.to("#pond-star", { y: 1990 - 130, duration: 0.5, ease: "power2.out" }, 2.9);
      tl.to("#pond-star", { y: 2040 - 130, x: 790 - 130, rotation: -250, duration: 3.9, ease: "sine.inOut" }, 3.4);

      tl.to("#pond-star", { y: 3200 - 130, x: 640 - 130, rotation: -360, duration: 1.9, ease: "power1.inOut" }, 7.35);

      tl.to("#pond-starbody", { scaleY: 1, scaleX: 1, duration: 0.4, ease: "back.out(3)" }, 9.37);

      tl.to("#pond-sandglow", { opacity: 1, duration: 0.6, ease: "sine.out" }, 9.25);

      tl.to("#pond-starbody", { scaleY: 1, scaleX: 1, duration: 0.35, ease: "sine.out" }, 10.58);

      tl.to("#pond-star-smile", { opacity: 1, duration: 0.05 }, 13.92);
      tl.to("#pond-star-eyeR", { scaleY: 0.12, svgOrigin: "156 136", duration: 0.1, ease: "power2.in" }, 13.5);
      tl.to("#pond-star-eyeR", { scaleY: 1, duration: 0.16, ease: "back.out(2)" }, 13.86);
